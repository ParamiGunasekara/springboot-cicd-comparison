name: Spring Boot CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: incident-reporting-system

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: incident-reporting-system/pom.xml

      - name: Grant Maven Wrapper permission
        run: chmod +x mvnw

      - name: Build and test application
        run: ./mvnw -B clean verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v6
        with:
          name: incident-reporting-jar
          path: incident-reporting-system/target/*.jar
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: maven-test-reports
          path: incident-reporting-system/target/surefire-reports/
          retention-days: 7
      - name: Build Docker image
        run: |
          docker build -f Dockerfile.ci -t incident-reporting-system:ci .

      - name: Verify Docker image
        run: |
          docker image inspect incident-reporting-system:ci
          docker images incident-reporting-system
      - name: Run container
        run: |
          docker run -d --name incident-ci \
            -p 127.0.0.1:8080:8080 \
            incident-reporting-system:ci

      - name: Verify application health
        run: |
          echo "Waiting for Spring Boot application..."

          for i in {1..30}; do
            if curl --fail --silent --show-error \
              --max-time 5 \
              http://localhost:8080/actuator/health \
              -o health.json && jq -e '.status == "UP"' health.json; then
              echo "Application is healthy"
              exit 0
            fi

            echo "Attempt $i: Application not ready"
            sleep 3
          done

          echo "Application failed to become healthy"
          docker logs incident-ci
          exit 1
      - name: Test Incident API
        run: |
          curl --fail --silent --show-error \
            -X POST http://localhost:8080/api/incidents \
            -H "Content-Type: application/json" \
            -d '{"title":"CI Smoke Test","description":"Automated API verification","severity":"HIGH"}' \
            | tee incident.json

          jq -e '.id != null and .status == "OPEN" and .severity == "HIGH"' incident.json

          ID=$(jq -r '.id' incident.json)

          curl --fail --silent --show-error \
            "http://localhost:8080/api/incidents/$ID" \
            | jq -e '.title == "CI Smoke Test"'

      - name: Container logs and cleanup
        if: always()
        run: |
          docker logs incident-ci || true
          docker rm -f incident-ci || true

      - name: Publish image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/incident-reporting-system"

          echo "$GHCR_TOKEN" | docker login ghcr.io \
            -u "$GITHUB_ACTOR" --password-stdin

          docker tag incident-reporting-system:ci "$IMAGE:latest"
          docker tag incident-reporting-system:ci "$IMAGE:$GITHUB_SHA"

          docker push "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"

          docker logout ghcr.io
  deploy:
    name: Deploy to AWS EC2
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    concurrency:
      group: incident-ec2-deployment
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy application using AWS SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/incident-reporting-system:${GITHUB_SHA}"

          jq -n --arg image "$IMAGE" '{
            commands: [
              "set -e",
              ("docker pull " + $image),
              "docker rm -f incident-reporting-app 2>/dev/null || true",
              ("docker run -d --name incident-reporting-app --restart unless-stopped --memory=384m -e JAVA_TOOL_OPTIONS=\"-Xms64m -Xmx192m\" -p 127.0.0.1:8081:8080 " + $image),
              "for i in $(seq 1 40); do if curl -fsS --max-time 5 http://localhost:8081/actuator/health | grep -q \"\\\"status\\\":\\\"UP\\\"\"; then echo Application is healthy; exit 0; fi; sleep 3; done",
              "docker logs --tail 100 incident-reporting-app",
              "exit 1"
            ]
          }' > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null) || STATUS="Pending"

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut)
                break
                ;;
            esac

            sleep 5
          done

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json

          test "$STATUS" = "Success"  
              